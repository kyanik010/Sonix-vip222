name: Build SONIX TV APK

concurrency:
  group: sonix-tv-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - fix/sonix-tv-scrolling
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-36.1" "build-tools;36.0.0" "platform-tools"

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.3.1'
          cache-provider: basic

      - name: Verify Java and Gradle
        run: |
          java -version
          gradle --version

      - name: Generate Android debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Validate WebView JavaScript and remove demo data
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re
          from pathlib import Path
          html = Path("app/src/main/assets/sonix_tv.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, re.S)
          inline_scripts = [item for item in scripts if item.strip()]
          if not inline_scripts:
              raise SystemExit("No inline application script found")
          Path("/tmp/sonix-tv-inline.js").write_text("\\n".join(inline_scripts), encoding="utf-8")
          PY
          node --check /tmp/sonix-tv-inline.js
          if grep -En "MOCK_|BigBuckBunny|TearsOfSteel|ForBigger|test-streams|example\\.com|محمد الأحمد|386683283365|VIP ULTRA|24ms" app/src/main/assets/sonix_tv.html; then
            echo "Demo data or sample playback URL remains in the user app"
            exit 1
          fi

      - name: Build APK with assembleDebug
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify generated APK
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK_PATH"
          echo "APK_PATH=$APK_PATH"
          ls -lh "$APK_PATH"
          sha256sum "$APK_PATH"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SONIX-TV-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
